<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>

     <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
         body{
            font-family: 'Gill Sans';
            background-color: rgb(241, 180, 175);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

         .container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: auto;
            box-shadow: 0 4px 10px rgb(0, 0, 0);
            background-color: rgb(142, 149, 70);
            color:  rgb(254, 254, 254);
            text-align: center;
       }

       .result {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: auto;
            background-color:rgb(233, 226, 155);
            color:  rgb(254, 254, 254);
            text-align: left;
            color:rgb(108, 155, 118) ;
       }

       .instructions {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: auto;
            background-color:rgb(242, 136, 146);
            color:  rgb(254, 254, 254);
            text-align: left;
       }

       .header h1{
        font-family: 'Gill Sans';
        color: rgb(242, 136, 146);
        font-weight: bold;
       }

       .header h5{
        font-family: 'Gill Sans';
        color: rgb(242, 136, 146);
       }
    </style>
</head>
<body>
     <div class="container">
         <div class="header">
            <h1>Non-Metal Elements</h1>
            <h5>Periodic Table Information Finder</h5>

         <div class="instructions">
                <b>❕Instructions:</b>
                <p class="mb-0">
                    Enter the <b>symbol</b> of a non-metal element.
                </p>
            <form>

            <input type="text" id="element1" class="form-control" placeholder="H">
            <br>

            <div class="text-center">
            <button type="button" id="btncheck" py-click="search_element" class="btn btn-light"> Search Details</button>
            </div>
            </form>
        <br>
        <br>
     </div>
        <br>
        <br>
      <div class="result">
            <h5><b>📓Details:</b></h5>
            <!--Element Name, Atomic Number, Atomic Mass -->
            <p><b>Element Name:</b> <span id="name"></span></p>
            <p><b>Atomic Number:</b> <span id="number"></span></p>
            <p><b>Atomic Mass:</b> <span id="mass"></span></p>
        </div>
    <script type="py" src="main.py"></script>
    </div>
</body>
</html>
